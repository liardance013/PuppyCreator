
name: Build PuppyCreator 3 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract PuppyCreator 3 source
        run: |
          unzip -q -o PuppyCreator-3.0-Android-source-fixed.zip -d v3

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            mkdir -p "$ANDROID_HOME/cmdline-tools"

            curl -fL --retry 3 \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
              -o /tmp/android-tools.zip

            mkdir -p /tmp/android-cli

            unzip -q /tmp/android-tools.zip -d /tmp/android-cli

            mv /tmp/android-cli/cmdline-tools \
              "$ANDROID_HOME/cmdline-tools/latest"
          fi

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compile APK
        working-directory: v3
        run: |
          gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PuppyCreator-3.0-APK
          path: v3/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
